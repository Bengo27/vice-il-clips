<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VICE IL CLIPS · הקליפים של GTA 6 מהסטרימרים הישראלים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<style>
:root{
  --bg:#0e0b14; --card:#17131f; --card2:#1f1a2a; --line:#2c2539; --hover:#231d31;
  --pink:#ff3fa4; --orange:#ff8a3d; --up:#ff6a3d; --down:#7c8cff; --cyan:#3ee6ff;
  --text:#ece6f5; --mute:#9488a8; --grad:linear-gradient(100deg,#ff3fa4,#ff8a3d);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Rubik,system-ui,sans-serif;font-size:14px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(14,11,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:18px}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo .v{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .il{font-size:11px;font-weight:700;border:1px solid var(--cyan);color:var(--cyan);padding:2px 6px;border-radius:5px}
.tabs{display:flex;gap:4px}
.tabs button{background:none;border:0;padding:8px 14px;border-radius:99px;color:var(--mute);cursor:pointer;font-weight:500}
.tabs button:hover{background:var(--hover);color:var(--text)}
.tabs button.on{background:var(--card2);color:var(--text)}
.range{display:none;gap:4px}
.range.show{display:flex}
.range button{background:none;border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:var(--mute);cursor:pointer;font-size:12.5px}
.range button.on{border-color:var(--pink);color:var(--text)}
.status{margin-inline-start:auto;font-size:12px;color:var(--mute);white-space:nowrap}
/* layout */
.page{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:grid;grid-template-columns:1fr 310px;gap:20px}
@media(max-width:900px){.page{grid-template-columns:1fr}.tabs button{padding:8px 10px}.status{display:none}}
/* feed */
.post{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;transition:border-color .12s}
.post:hover{border-color:#4a3d62}
.vote{display:flex;flex-direction:column;align-items:center;width:42px;flex:none;padding-top:2px}
.vote button{background:none;border:0;cursor:pointer;color:var(--mute);font-size:18px;line-height:1;padding:3px 6px;border-radius:4px}
.vote button:hover{background:var(--hover)}
.vote .sc{font-weight:700;font-size:13px;margin:2px 0}
.vote.up .u,.vote.up .sc{color:var(--up)} .vote.down .d,.vote.down .sc{color:var(--down)}
.th{position:relative;width:176px;flex:none;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--card2);cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .du{position:absolute;bottom:5px;left:5px;background:rgba(0,0,0,.8);font-size:11px;font-weight:700;padding:1px 5px;border-radius:4px}
.th .pl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.35);opacity:0;transition:.12s;font-size:26px}
.th:hover .pl{opacity:1}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.title{font-size:16px;font-weight:700;line-height:1.3;cursor:pointer;word-break:break-word}
.title:hover{text-decoration:underline}
.flair{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:rgba(255,63,164,.16);color:var(--pink);vertical-align:2px;margin-inline-start:6px}
.flair.bot{background:rgba(148,136,168,.15);color:var(--mute)}
.meta{color:var(--mute);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.meta .st{color:var(--text);font-weight:500;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.meta .st img{width:18px;height:18px;border-radius:50%;object-fit:cover}
.acts{display:flex;gap:4px;margin-top:auto}
.acts button,.acts a{background:none;border:0;color:var(--mute);font-size:12.5px;font-weight:500;padding:5px 8px;border-radius:4px;cursor:pointer}
.acts button:hover,.acts a:hover{background:var(--hover);color:var(--text)}
@media(max-width:600px){.post{flex-wrap:wrap}.th{width:100%;order:-1}.vote{flex-direction:row;width:auto;gap:4px}.body{flex-basis:calc(100% - 100px)}}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:40px;text-align:center;color:var(--mute)}
/* sidebar */
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.box h3{margin:0;padding:11px 14px;font-size:13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.box .bd{padding:10px 14px}
.hero{background:linear-gradient(135deg,#3a0f3a,#2a0f20 50%,#1b0f2a);padding:16px 14px}
.hero b{font-size:16px}
.hero p{margin:6px 0 0;color:#d6c6e8;font-size:13px;line-height:1.5}
.dot{width:8px;height:8px;border-radius:50%;background:#ff2d55;box-shadow:0 0 8px #ff2d55;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.3}}
.lv{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.lv:last-child{border:0}
.lv img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none}
.lv .n{font-weight:500}
.lv .t{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.lv .c{margin-inline-start:auto;font-size:12px;color:#ff6b88;font-weight:700;white-space:nowrap}
.lv.off{opacity:.5}
.more{display:block;width:100%;background:none;border:0;color:var(--mute);padding:8px 0 2px;cursor:pointer;font-size:12.5px}
.more:hover{color:var(--text)}
.sr{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;margin:0 -8px}
.sr:hover{background:var(--hover)}
.sr.on{background:rgba(255,63,164,.14)}
.sr img{width:22px;height:22px;border-radius:50%;object-fit:cover}
.sr .k{margin-inline-start:auto;color:var(--mute);font-size:12px}
.row{display:flex;gap:6px}
.inp{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:8px 10px;font:inherit;direction:ltr;text-align:right}
.btn{background:var(--grad);border:0;border-radius:6px;padding:8px 12px;font-weight:700;color:#1a0b14;cursor:pointer;white-space:nowrap}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--mute);font-size:13px;margin-top:10px}
.note{font-size:12px;color:var(--mute);margin-top:8px;line-height:1.5}
/* modal */
.modal{position:fixed;inset:0;background:rgba(4,2,8,.88);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal.on{display:flex}
.mbox{width:min(980px,100%);background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mhead{display:flex;gap:12px;padding:14px;align-items:flex-start}
.mhead .title{font-size:19px;cursor:default}
.mhead .title:hover{text-decoration:none}
.x{background:none;border:0;font-size:28px;line-height:1;cursor:pointer;color:var(--mute);margin-inline-start:auto}
video{width:100%;display:block;background:#000;max-height:72vh}
.mfoot{display:flex;gap:6px;padding:10px 14px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:9px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--mute);border-top-color:var(--pink);border-radius:50%;animation:r .8s linear infinite;vertical-align:-1px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>

    for(const c of j.clips||[]){
      if(c.created_at<LAUNCH){old=true;continue}
      const o={id:c.id,title:(c.title||"").trim(),views:c.view_count||0,likes:c.likes_count||0,dur:c.duration||0,at:c.created_at,channel:s.slug,creator:c.creator?.username,cat:c.category?.slug,thumb:c.thumbnail_url,video:c.video_url};
      if(keep(o,s)) clips.set(o.id,o);
    }
    if(old||!j.nextCursor) break; cursor=j.nextCursor;
  }
  return s;
}
// Discover Hebrew streams live right now (works only where Kick allows it; ignored otherwise)
async function discover(){
  try{const j=await getJSON("https://web.kick.com/api/v1/livestreams?limit=100&sort=viewer_count_desc&language=he");
    for(const l of j.data.livestreams) if(!streams.has(l.channel.slug)&&(l.category?.slug===GTA||RX.test(l.title)))
      streams.set(l.channel.slug,{slug:l.channel.slug,name:l.channel.username,pic:l.channel.profile_pic,live:true,viewers:l.viewer_count,title:l.title,category:l.category?.slug,wins:[]});
  }catch{}
}
async function refresh(){
  $("#status").innerHTML=`<span class="spin"></span> מתעדכן מקיק…`;
  await discover();
  const res=await Promise.allSettled([...streams.keys()].map(loadStreamer));
  if(res.some(r=>r.status==="fulfilled")){source="live";updated=new Date().toISOString()}
  render();
}

// ================= render =================
function voteHTML(c){const v=votes[c.id]||0;return `<div class="vote ${v>0?"up":v<0?"down":""}" data-id="${esc(c.id)}">
  <button class="u" data-vote="1" aria-label="למעלה">▲</button><div class="sc">${score(c)}</div><button class="d" data-vote="-1" aria-label="למטה">▼</button></div>`}
function metaHTML(c){const s=streams.get(c.channel)||{name:c.channel};return `
  <span class="st" data-st="${esc(c.channel)}"><img src="${esc(s.pic||av(s.name))}" alt="">${esc(s.name)}</span>
  <span>· ${ago(c.at)}</span><span>· 👁 ${c.views} צפיות</span>${c.creator?`<span>· קליפ של ${esc(c.creator)}</span>`:""}`}
function render(){
  const st=[...streams.values()];
  let list=[...clips.values()];
  if(hideBots) list=list.filter(c=>!isBot(c));
  if(sort==="top"&&range==="24") list=list.filter(c=>hrs(c.at)<24);
  const counts={}; list.forEach(c=>counts[c.channel]=(counts[c.channel]||0)+1);
  if(only) list=list.filter(c=>c.channel===only);
  const cmp={hot:(a,b)=>hot(b)-hot(a), new:(a,b)=>b.at.localeCompare(a.at), top:(a,b)=>score(b)-score(a)||b.views-a.views||b.at.localeCompare(a.at)}[sort];
  list.sort(cmp);

  $("#feed").innerHTML = (only?`<div class="empty" style="padding:12px;margin-bottom:8px;text-align:right">מציג רק את <b>${esc(streams.get(only)?.name||only)}</b> · <a href="#" data-clear style="color:var(--pink)">הצג את כולם</a></div>`:"") +
   (list.length? list.map(c=>`
    <article class="post">
      ${voteHTML(c)}
      <div class="th" data-open="${esc(c.id)}"><img loading="lazy" src="${esc(c.thumb)}" alt=""><span class="du">${fmtDur(c.dur)}</span><span class="pl">▶</span></div>
      <div class="body">
        <div class="title" data-open="${esc(c.id)}">${esc(c.title||"ללא כותרת")}${c.cat===GTA?`<span class="flair">GTA VI</span>`:""}${isBot(c)?`<span class="flair bot">אוטומטי</span>`:""}</div>
        <div class="meta">${metaHTML(c)}</div>
        <div class="acts"><button data-open="${esc(c.id)}">▶ צפייה</button><button data-share="${esc(c.id)}">🔗 שיתוף</button>
          <a href="https://kick.com/${esc(c.channel)}/clips/${esc(c.id)}" target="_blank" rel="noopener">↗ בקיק</a></div>
      </div>
    </article>`).join("") : `<div class="empty">אין עדיין קליפים כאן. GTA 6 יצא רק עכשיו, תחזרו עוד מעט 🌴</div>`);

  const playing=st.filter(s=>s.live&&(s.category===GTA||RX.test(s.title))).sort((a,b)=>b.viewers-a.viewers);
  // keep the sidebar short: top 5 live / top 8 streamers, the rest behind "show more"
  const LIVE_N=5, ST_N=8;
  const liveShown=showAllLive?playing:playing.slice(0,LIVE_N);
  $("#live").innerHTML = playing.length? liveShown.map(s=>`
    <a class="lv" href="https://kick.com/${esc(s.slug)}" target="_blank" rel="noopener"><img src="${esc(s.pic||av(s.name))}" alt="">
      <div style="min-width:0"><div class="n">${esc(s.name)}</div><div class="t">${esc(s.title)}</div></div>
      <span class="c">● ${s.viewers.toLocaleString("he-IL")}</span></a>`).join("") +
      (playing.length>LIVE_N?`<button class="more" data-more="live">${showAllLive?"הצג פחות ▴":`+ עוד ${playing.length-LIVE_N} בלייב ▾`}</button>`:"")
    : `<div class="note">אף אחד לא משחק כרגע.</div>`;

  const stSorted=st.sort((a,b)=>(only===b.slug)-(only===a.slug)||(counts[b.slug]||0)-(counts[a.slug]||0));
  const stShown=showAllSt?stSorted:stSorted.slice(0,ST_N);
  $("#streamers").innerHTML = stShown.map(s=>`
    <div class="sr ${only===s.slug?"on":""}" data-st="${esc(s.slug)}"><img src="${esc(s.pic||av(s.name))}" alt="">${esc(s.name)}${s.live?` <span class="dot" style="width:6px;height:6px"></span>`:""}<span class="k">${counts[s.slug]||0}</span></div>`).join("") +
    (stSorted.length>ST_N?`<button class="more" data-more="st">${showAllSt?"הצג פחות ▴":`+ עוד ${stSorted.length-ST_N} סטרימרים ▾`}</button>`:"");

  $("#status").innerHTML = source==="live"?`🟢 חי מקיק · ${clips.size} קליפים · ${streams.size} סטרימרים`:`${source==="site"?"🟢 עודכן":"📦 תמונת מצב"} · ${new Date(updated).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})}`;
  $("#hideBots").checked=hideBots;
  if(openId) renderModalHead();
}

// ================= post view =================
let hls=null, openId=null;
function renderModalHead(){
  const c=clips.get(openId); if(!c) return;
  $("#mVote").outerHTML=voteHTML(c).replace('class="vote','id="mVote" class="vote');
  $("#mTitle").innerHTML=esc(c.title||"ללא כותרת")+(c.cat===GTA?`<span class="flair">GTA VI</span>`:"");
  $("#mMeta").innerHTML=metaHTML(c);
  $("#mActs").innerHTML=`<button data-share="${esc(c.id)}">🔗 העתק קישור</button><a href="https://kick.com/${esc(c.channel)}/clips/${esc(c.id)}" target="_blank" rel="noopener">↗ פתח בקיק</a>`;
}
function openClip(id,push=true){
  const c=clips.get(id); if(!c) return; openId=id; renderModalHead();
  const v=$("#vid"); if(hls){hls.destroy();hls=null}
  if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(c.video);hls.attachMedia(v)} else v.src=c.video;
  $("#modal").classList.add("on"); v.play().catch(()=>{});
  if(push&&location.hash!=="#"+id) history.replaceState(null,"","#"+id);
}
function closeClip(){openId=null;const v=$("#vid");v.pause();if(hls){hls.destroy();hls=null}v.removeAttribute("src");$("#modal").classList.remove("on");if(location.hash)history.replaceState(null,"",location.pathname+location.search)}

// ================= events =================
document.addEventListener("click",e=>{
  const t=e.target;
  const mb=t.closest("[data-more]"); if(mb){if(mb.dataset.more==="live")showAllLive=!showAllLive;else showAllSt=!showAllSt;return render()}
  const vb=t.closest("[data-vote]"); if(vb){const id=vb.closest(".vote").dataset.id,v=+vb.dataset.vote,prev=votes[id]||0,nv=prev===v?0:v;
    if(nv)votes[id]=nv;else delete votes[id];store.set("vf_votes",votes);
    if(sharedOK){shared[id]=(shared[id]||0)+nv-prev;sendVote(id,nv)}
    return render()}
  const op=t.closest("[data-open]"); if(op) return openClip(op.dataset.open);
  const sh=t.closest("[data-share]"); if(sh){const u=location.href.split("#")[0]+"#"+sh.dataset.share;navigator.clipboard?.writeText(u).then(()=>toast("הקישור הועתק"),()=>toast(u));return}
  const sr=t.closest("[data-st]"); if(sr){only=only===sr.dataset.st?null:sr.dataset.st;closeClip();window.scrollTo({top:0});return render()}
  if(t.closest("[data-clear]")){e.preventDefault();only=null;return render()}
  const tb=t.closest("#tabs button"); if(tb){sort=tb.dataset.v;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b===tb));$("#range").classList.toggle("show",sort==="top");return render()}
  const rb=t.closest("#range button"); if(rb){range=rb.dataset.v;document.querySelectorAll("#range button").forEach(b=>b.classList.toggle("on",b===rb));return render()}
  if(t.id==="modal"||t.id==="mClose") return closeClip();
  if(t.closest("#home")){only=null;closeClip();render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeClip()});
$("#hideBots").onchange=e=>{hideBots=e.target.checked;store.set("vf_hidebots",hideBots);render()};
// Admin (open the site with #admin once; remembered on this device)
if(location.hash==="#admin"){store.set("vf_admin",true);history.replaceState(null,"",location.pathname)}
if(store.get("vf_admin",false)) $("#adminBox").style.display="";
$("#addForm").addEventListener("submit",async e=>{
  e.preventDefault();const slug=$("#addInput").value.trim().toLowerCase().replace(/^.*kick\.com\//,"").replace(/[\/?#].*$/,"");
  if(!slug) return; $("#adminMsg").textContent="בודק את "+slug+"…";
  try{const s=await loadStreamer(slug);const ex=store.get("vf_extra",[]);if(!ex.includes(s.slug)){ex.push(s.slug);store.set("vf_extra",ex)}
    source="live";render();const n=[...clips.values()].filter(c=>c.channel===s.slug).length;
    $("#adminMsg").innerHTML=(n?`✅ <b>${esc(s.name)}</b>: ${n} קליפים מ-GTA 6. עכשיו רק אצלך.`:`⚠️ <b>${esc(s.name)}</b> קיים, אבל אין לו קליפים מ-GTA 6.`)+
      `<br>כדי שכולם יראו: לחצו למטה ← Run workflow ← הדביקו <b dir="ltr">${esc(s.slug)}</b> ← Run.`;
    navigator.clipboard?.writeText(s.slug).catch(()=>{})}
  catch{$("#adminMsg").textContent=`לא מצאתי ערוץ "${slug}". העתיקו את הקישור משורת הכתובת בקיק.`}
});
window.addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(id&&clips.has(id))openClip(id,false)});

// ---- shared votes (Cloudflare Pages Functions + D1) ----
async function loadVotes(){
  try{const r=await fetch("/api/votes",{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();shared=j.scores||{};sharedOK=true}catch{}
}
async function sendVote(clip,v){
  try{const r=await fetch("/api/vote",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({clip,voter,v})});
    if(r.ok){const j=await r.json();shared[clip]=j.score;render()}else toast("ההצבעה לא נשמרה")}
  catch{toast("ההצבעה לא נשמרה")}
}
// Data collected every 15 min by the GitHub Action (data.json), plus the list of known streamers.
async function loadSiteData(){
  try{const d=await getJSON("data.json");applyData(d);updated=d.g;source="site"}catch{}
  try{
    const list=await getJSON("streamers.json"), keepSet=new Set([...list,...store.get("vf_extra",[])]);
    for(const slug of [...streams.keys()]) if(!keepSet.has(slug)) streams.delete(slug);       // removed by admin
    for(const [id,c] of [...clips]) if(!keepSet.has(c.channel)) clips.delete(id);
    for(const slug of list) if(!streams.has(slug)) streams.set(slug,{slug,name:slug,pic:"",viewers:0,title:"",category:"",live:false,wins:[]});
  }catch{}
}
render();
if(location.hash.length>1&&clips.has(location.hash.slice(1))) openClip(location.hash.slice(1),false);
Promise.all([loadSiteData(),loadVotes()]).then(()=>{render();return refresh()}).then(()=>{if(location.hash.length>1&&!openId&&clips.has(location.hash.slice(1)))openClip(location.hash.slice(1),false)});
setInterval(()=>loadVotes().then(refresh),3*60*1000);
</script>
