name: הוסף / הסר סטרימר

on:
  workflow_dispatch:
    inputs:
      channels:
        description: "שם ערוץ בקיק או קישור (כמה? להפריד בפסיק)"
        required: true
      action:
        description: "מה לעשות"
        type: choice
        options: [הוסף, הסר]
        default: הוסף

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update streamers.json
        env:
          CHANNELS: ${{ inputs.channels }}
          ACTION: ${{ inputs.action }}
        run: |
          node -e '
            const fs = require("fs");
            const f = "site/streamers.json";
            const list = JSON.parse(fs.readFileSync(f, "utf8"));
            const slugs = process.env.CHANNELS.split(/[,\s]+/).map(s => s.trim().toLowerCase()
              .replace(/^.*kick\.com\//, "").replace(/[\/?#].*$/, "").replace(/_/g, "-").replace(/^-+|-+$/g, "")).filter(Boolean);
            for (const s of slugs) {
              const i = list.indexOf(s);
              if (process.env.ACTION === "הסר") { if (i >= 0) { list.splice(i, 1); console.log("removed", s); } }
              else if (i < 0) { list.push(s); console.log("added", s); }
              else console.log("already there", s);
            }
            fs.writeFileSync(f, JSON.stringify(list, null, 1) + "\n");
          '
          git config user.name "vice-il-clips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/streamers.json
          git diff --cached --quiet || (git commit -m "${{ inputs.action }}: ${{ inputs.channels }}" && git push)
          # Cloudflare Pages redeploys the site automatically after this push
