name: Update clips & deploy

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect clips from Kick
        run: node scripts/collect.mjs
        continue-on-error: true

      - name: Save streamer list & data
        run: |
          git config user.name "vice-il-clips-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/streamers.json site/data.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update clips [skip ci]" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
